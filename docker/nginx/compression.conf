# Compresi贸n Gzip (compatible con todos los navegadores)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/xhtml+xml
    application/x-font-ttf
    application/x-font-opentype
    application/vnd.ms-fontobject
    image/svg+xml;

# Desactivar gzip para IE6
gzip_disable "msie6";

# Tama帽o m铆nimo para comprimir
gzip_min_length 256;

# Buffer de compresi贸n
gzip_buffers 16 8k;

# Nivel de protocolo HTTP
gzip_http_version 1.1;

# Cache para assets est谩ticos (con hash en el nombre)
location ~* ^/build/assets/.*\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Cache para otros assets
location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# Cache para fuentes
location ~* \.(woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}
